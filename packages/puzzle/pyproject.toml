[project]
name = "puzzle"
version = "0.1.0"
description = "Puzzle Python SDK"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "puzzle-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzle"]

[tool.uv.sources]
puzzle-shared = { workspace = true }
