[project]
name = "puzzleai"
version = "0.1.0a2"
description = "Thin Python SDK for the Puzzle API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1.0"]
authors = [{ name = "PuzzleAI" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://puzzleai.us"
Documentation = "https://puzzleai.us/alpha-api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzleai"]

[tool.hatch.build.targets.sdist]
only-include = [
  "README.md",
  "pyproject.toml",
  "src/puzzleai",
]
