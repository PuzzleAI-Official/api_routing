[project]
name = "puzzle-shared"
version = "0.1.0"
description = "Shared schemas and contracts for Puzzle"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzle_shared"]
