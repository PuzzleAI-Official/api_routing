[project]
name = "puzzle-gateway"
version = "0.1.0"
description = "Puzzle API and routing gateway"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13",
  "cryptography>=43.0",
  "fastapi>=0.115",
  "google-cloud-kms>=3.5",
  "google-cloud-storage>=2.18",
  "httpx>=0.27",
  "opentelemetry-api>=1.26",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "puzzle-shared",
  "python-multipart>=0.0.12",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "structlog>=24.1",
  "tenacity>=8.5",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
puzzle-gateway = "puzzle_gateway.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzle_gateway"]

[tool.uv.sources]
puzzle-shared = { workspace = true }
