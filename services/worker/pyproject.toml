[project]
name = "puzzle-worker"
version = "0.1.0"
description = "Puzzle async job worker"
requires-python = ">=3.12"
dependencies = ["puzzle-gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzle_worker"]

[tool.uv.sources]
puzzle-gateway = { workspace = true }
