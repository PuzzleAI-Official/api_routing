[project]
name = "puzzle-telemetry"
version = "0.1.0"
description = "Puzzle telemetry ingest service"
requires-python = ">=3.12"
dependencies = ["puzzle-gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/puzzle_telemetry"]

[tool.uv.sources]
puzzle-gateway = { workspace = true }
