services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: puzzle
      POSTGRES_USER: puzzle
      POSTGRES_PASSWORD: puzzle
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puzzle -d puzzle"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "beta", "emulators", "pubsub", "start", "--host-port=0.0.0.0:8681"]
    ports:
      - "8681:8681"

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command: ["-scheme", "http", "-port", "4443"]
    ports:
      - "4443:4443"

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://puzzle:puzzle@postgres:5432/puzzle
      REDIS_URL: redis://redis:6379/0
      PUBSUB_EMULATOR_HOST: pubsub:8681
      PUZZLE_ENV: local
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://puzzle:puzzle@postgres:5432/puzzle
      REDIS_URL: redis://redis:6379/0
      PUBSUB_EMULATOR_HOST: pubsub:8681
      PUZZLE_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  telemetry:
    build:
      context: .
      dockerfile: services/telemetry/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://puzzle:puzzle@postgres:5432/puzzle
      PUBSUB_EMULATOR_HOST: pubsub:8681
      PUZZLE_ENV: local
    depends_on:
      postgres:
        condition: service_healthy
